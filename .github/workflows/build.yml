name: Build extensions

on:
  push:
    branches: [main]
    paths:
      - "src/onlinestream/**/payload.ts"
      - "src/manga/**/payload.ts"
      - "src/_shared/**"
      - "bundle.ts"
  pull_request:
    paths:
      - "src/onlinestream/**/payload.ts"
      - "src/manga/**/payload.ts"
      - "src/_shared/**"
      - "bundle.ts"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Resolve base ref
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}"
            echo "ref=$(git merge-base "origin/${{ github.base_ref }}" HEAD)" >> "$GITHUB_OUTPUT"
          elif git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump extension versions for changed extractors
        if: steps.base.outputs.ref != ''
        run: npx tsx scripts/bump-extension-versions.ts "${{ steps.base.outputs.ref }}"

      - name: Determine concerned extensions
        id: concerned
        run: |
          if [ -n "${{ steps.base.outputs.ref }}" ]; then
            DIRS=$(npx tsx scripts/concerned-extensions.ts "${{ steps.base.outputs.ref }}" HEAD)
          else
            DIRS=$(npx tsx scripts/concerned-extensions.ts)
          fi

          echo "dirs<<EOF" >> "$GITHUB_OUTPUT"
          echo "$DIRS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          MANIFESTS=$(echo "$DIRS" | sed '/^$/d' | awk '{print $0"/manifest.json"}' | tr '\n' ' ')
          echo "manifests=$MANIFESTS" >> "$GITHUB_OUTPUT"

      - name: Build concerned extensions
        run: |
          DIRS="${{ steps.concerned.outputs.dirs }}"
          npx tsx bundle.ts $DIRS

      - name: Check manifest payloads
        run: npx tsx scripts/check-payloads.ts

      - name: Check for manifest changes on concerned extensions
        if: github.event_name == 'push'
        id: diff
        run: |
          if [ -n "${{ steps.concerned.outputs.manifests }}" ] && ! git diff --quiet -- ${{ steps.concerned.outputs.manifests }}; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated manifests
        if: github.event_name == 'push' && steps.diff.outputs.changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: rebuild manifest.json for updated extensions"
          file_pattern: ${{ steps.concerned.outputs.manifests }}
