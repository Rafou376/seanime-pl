name: Build extensions

on:
  push:
    branches: [main]
    paths:
      - "src/onlinestream/**/payload.ts"
      - "src/manga/**/payload.ts"
      - "src/_shared/**"
      - "scripts/**"
      - "bundle.ts"
      - "tsconfig*.json"
      - ".github/workflows/build.yml"
      - ".github/actions/**"
  pull_request:
    paths:
      - "src/onlinestream/**/payload.ts"
      - "src/manga/**/payload.ts"
      - "src/_shared/**"
      - "scripts/**"
      - "bundle.ts"
      - "tsconfig*.json"
      - ".github/workflows/build.yml"
      - ".github/actions/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/build-extensions

  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build extensions
        id: build
        uses: ./.github/actions/build-extensions

      - name: Commit updated manifests
        if: steps.build.outputs.manifests != ''
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: rebuild updated extensions"
          file_pattern: ${{ steps.build.outputs.manifests }}
          commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
