version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    labels: []
    commit-message:
      prefix: chore
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: []
    commit-message:
      prefix: chore
    groups:
      actions:
        patterns:
          - "*"
